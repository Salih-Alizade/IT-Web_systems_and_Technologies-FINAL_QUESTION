<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 4</title>
    <style>

        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            font-family:serif;
            margin: 0;
            padding: 0px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box-model h3{
            color: blueviolet;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .box-model{
            width: 300px;
            border: 5px solid blueviolet;
            padding: 20px 40px 40px 20px;
            background-color: rgb(216, 191, 191);
            /*
            padding-left: 20px;
            padding-right: 40px;
            padding-top: 40px;
            padding-bottom: 40px;
            */
        }

        .box-model p{
            line-height: 1.2;
        }

    </style>
</head>

<body>
    <div class="box-model">
        <h3>Box Model Example</h3>
        <p>This element has margin, border, padding and content areas.</p>
    </div>
</body>
</html>
