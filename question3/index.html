<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 3</title>
    <style>
        body{
            font-family:serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0px;
        }

        .container{
            display: flex;
            margin: 0 30px;
            gap: 10px;
        }

        p{
            padding: 20px 60px;
            border-radius: 8px;
            color: white;
            flex: 1;
            text-align: center;
        }

        .First{
            background-color: red;
        }

        .Second{
            background-color: blue;
        }

        .Third{
            background-color: green;
        }

    </style>
</head>
<body>
    <div class="container">
        <p class="First">First</p>
        <p class="Second">Second</p>
        <p class="Third">Third</p>
    </div>	
</body>
</html>
