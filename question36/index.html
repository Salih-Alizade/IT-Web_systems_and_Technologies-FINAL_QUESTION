<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 36</title>
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            font-family: serif;
            height: 100vh;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            border: 5px solid #3DE0D0;
            padding: 15px 50px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h3{
            margin: 10px 0;
            font-size: 2.5rem;
            color: #04CDD0;
            text-align: center;
        }

        p{
            margin: 10px 0;
            font-size: 1.5rem;
            color: #118F8F;
            
        }

        .outbox{
            border: 5px solid #3DE0D0;
            padding: 5px;
            width: 35%;
            height: 40%;
        }

    </style>
</head>
<body>
    <div class="outbox">
	    <div class="container">
            <h3>Double Border Style</h3>
            <p >Welcome to our web page</p>
        </div>
    </div>
</body>
</html>
