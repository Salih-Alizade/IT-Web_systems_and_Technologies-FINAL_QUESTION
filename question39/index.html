<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 39</title>
    <style>

        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            font-family:serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid-container{
            width: 350px;
            height: 250px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            background-color: #FFFFDF;
        }

        .box{
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .title{
            background-color: #B9850B;
            grid-area: 1/1/2/3;
        }

        .box2{
            background-color: #DAA422;
            grid-area: 2/1/3/2;
        }

        .box3{
            background-color: #DAA422;
            grid-area: 2/2/3/3;
        }

    </style>
</head>
<body>
	<div class="grid-container">
        <div class="box title">Title</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
    </div>	 
</body>
</html>
