<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 26</title>
    <style>

        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            font-family:serif;
            margin: 0;
            padding: 0px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            width: 320px;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            margin: 0;
            gap: 5px;
            border: 3px solid #1F1F73;
        }

        label{
            font-weight: bold;
            color: #1F1F73;
        }

        input{
            border: none;
            outline: none;
            border: 3px solid #1F1F73;
            margin-bottom: 10px;
            padding: 10px;
            transition: border-color 0.2s ease;
        }

        input:focus{
            border: 3px solid #1f732e;
        }

        textarea{
            border: none;
            outline: none;
            border: 3px solid #1F1F73;
            padding: 8px;
        }

        textarea:focus{
            border: 3px solid #1f732e;
        }

        select{
            border: none;
            margin-bottom: 20px;
            padding: 10px;
        }

        button{
            border: none;
            padding: 10px 30px;
            background-color: #4169E2;
            color:white;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover{
            cursor: pointer;
            background-color: #1F1F73;
        }

    </style>
</head>

<body>
    
    <form class="container">
        <label for="user_email">Email:</label>
        <input type="email" id="user_email" name="Email" placeholder="Enter email address" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="user_age" placeholder="Your age" min="0" max="100" required step="1"> <!--  step özelliği sayı artışı için kullanılır. -->
        <!-- Kullanıcı ok tuşlarıyla 10.5, 11.0, 11.5 şeklinde artırabilir
        <input type="number" step="0.5"> -->

        <label for="user_comments">Comments:</label>
        <textarea id="user_messages" rows="3" cols="50" placeholder="Write your comments here..."></textarea>

        <button type="submit">Submit Form</button>
    </form>

</body>

</html>
