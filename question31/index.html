<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 15</title>
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid-container {
            width: 320px;
            height: 360px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 1fr);
            grid-gap: 10px;

        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }
        
        .box-a{
            background-color: #0000CC;
            grid-column: 1/2;
            grid-row: 1/3;
        }

        .box-b{
            background-color: #000080;
            grid-column:2/3;
            grid-row: 1/2;
        }

        .box-c{
            background-color: #000080;
            grid-column:2/3; 
        }

        .box-d{
            background-color: #6B5ACC;
            grid-column: 1/3; 
            grid-row: 3/4; 
        }

    </style>
</head>
<body>
	<div class="grid-container">
        <div class="box box-a">A</div>
        <div class="box box-b">B</div>
        <div class="box box-c">C</div>
        <div class="box box-d">D</div>
    </div>
</body>
</html>
