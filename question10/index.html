<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2</title>
    <style>

        body{
            font-family:serif;
            margin: 0;
            padding: 0px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            width: 360px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            margin: 0;
            gap: 5px;
            background-color: #1FB3AA;
        }

        label{
            font-weight: bold;
            color: white;
        }

        input{
            border: none;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 10px;
        }

        textarea{
            border: none;
            border-radius: 8px;
            padding: 8px;
        }

        select{
            border: none;
            margin-bottom: 20px;
            padding: 10px;
        }

        button{
            border: none;
            padding: 10px 30px;
            border-radius: 8px;
            background-color: #F29B14;
            color:white;
            cursor: pointer;
            margin-top: 15px;
        }

    </style>
</head>

<body>
    
    <form class="container">
        <label for="user_name_surname">Full Name:</label>
        <input type="text" id="user_name_surname" name="Username_and_usersurname" placeholder="Your Name and Surname">

        <label for="user_email">Email:</label>
        <input type="email" id="user_email" name="Email" placeholder="email@example.com">

        <label for="user_messages">Messages:</label>
        <textarea id="user_messages" rows="3" cols="50" placeholder="Write your message..."></textarea>

        <button type="submit">Submit</button>
    </form>

</body>

</html>
