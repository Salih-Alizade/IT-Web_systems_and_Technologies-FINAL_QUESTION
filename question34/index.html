<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 34</title>
    <style>

        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            font-family:serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contact-form{
            padding:20px;
            border: 3px solid #9C7EDF;    
            width: 320px;
        }

        .contact-form form{
            display: flex;
            flex-direction: column;

        }

        .contact-form h3{
            color: #9405D2;
            margin-bottom: 10px;
        }
        
        .contact-form form label{
            margin-bottom: 3px;
            color: #7344A1;
            font-weight: bold;
        }

        .contact-form form input{
            width:100%;
            padding: 5px;
            margin-bottom: 15px;
            outline: none;
            border: 2px solid #AF96E4;
        }

        .contact-form form input:focus{
            border: 2px solid green;
        }

        textarea{
            border: none;
            outline: none;
            border: 2px solid #AF96E4;
            padding: 8px;
        }

        textarea:focus{
            border: 2px solid #1f732e;
        }

        .contact-form form button{
            padding: 10px 40px;
            margin-top: 15px;
            background-color: #8B2BE2;
            color: #fff;
            border: none;
            transition: background-color 0.2s ease;
        }

        .contact-form form button:hover{
            background-color: #B69FE7;
            cursor: pointer;
        }

    </style>
</head>
<body>
	<div class="contact-form">
        <h3>Contact Us</h3>
        <form>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="user_name" placeholder="Your name" required>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="user_subject" placeholder="Message Subject" required>

            <label for="user_messages">Message: </label>
            <textarea id="user_messages" rows="2" cols="50" placeholder="Type your message..."></textarea>

            <button type="submit">Send</button>
        </form>
    </div>
</body>
</html>
