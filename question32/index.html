<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 32</title>
    <style>

        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        p{
            font-size: 16px;
        }

        @media (min-width: 481px){
            p{
                font-size: 18px;
            }
        }


        @media (min-width: 1025px) {
            p{
                font-size: 20px;
            }
        }

    </style>
</head>
<body>
	<p>The size of the text changes depending on the screen size.</p>
</body>
</html>
