<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 23</title>
    <style>

        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            font-family:serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid-container{
            width: 610px;
            height: 200px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
        }

        .box{
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header{
            background-color: #B12322;
            grid-column: span 2;
            /* grid-area: 1/1/2/3; */
        }

        .box3{
            background-color: #B12322;
            /* grid-area: 2/1/3/2; */
        }

        .box4{
            background-color: #B12322;
            /* grid-area: 2/2/3/3; */
        }

    </style>
</head>
<body>
	<div class="grid-container">
        <div class="box header">Header</div>
        <div class="box box3">Box 3</div>
        <div class="box box4">Box 4</div>
    </div>	 
</body>
</html>
