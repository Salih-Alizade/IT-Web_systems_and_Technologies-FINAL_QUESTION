<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 35</title>
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid-container {
            width: 280px;
            height: 360px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 1fr);
            grid-gap: 10px;

        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.25rem;
        }
        
        .box-1{
            background-color: #008002;
            grid-column: 1/2;
            grid-row: 1/3;
        }

        .box-2{
            background-color: #31CC33;
            grid-column:2/3;
            grid-row: 1/2;
        }

        .box-3{
            background-color: #31CC33;
            grid-column:2/3; 
        }

        .box-4{
            background-color: #036400;
            grid-column: 1/3; 
            grid-row: 3/4; 
        }

    </style>
</head>
<body>
	<div class="grid-container">
        <div class="box box-1">1</div>
        <div class="box box-2">2</div>
        <div class="box box-3">3</div>
        <div class="box box-4">4</div>
    </div>
</body>
</html>
