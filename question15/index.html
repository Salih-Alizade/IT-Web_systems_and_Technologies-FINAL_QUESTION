<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 15</title>
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid-container {
            width: 320px;
            height: 320px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 1fr);
            grid-gap: 10px;

        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            border-radius: 6px;
        }
        
        .box-a{
            background-color: #E74C3C;
            grid-column: 1/2; /* grid-column:1;  */
            grid-row: 1/3;
            
            /* grid-column: 1/ span 1;
            grid-row: 1/span 2; */

            /* grid-area: 1/1/3/2; */
        }

        .box-b{
            background-color: #3498DB;
            grid-column:2/3;
            grid-row: 1/2;/* grid-row: 1; */

            /* grid-column: 2/ span 1;
            grid-row: 1 /span 1;   */

            /* grid-area: 1/2/2/3; */
        }

        .box-c{
            background-color: #3498DB;
            grid-column:2/3; /* grid-column:2;  */
            grid-row: 2/3; /* grid-row: 2; */

            /* grid-column: 2/ span 1;
            grid-row: 2/span 1; */

            /* grid-area: 2/2/3/3; */
        }

        .box-d{
            background-color: #2ECC71;
            grid-column: 1/3; 
            grid-row: 3/4; /* grid-row: 3; */

            /* grid-column: 1/ span 2; */
            /* grid-row: 3/ span 1; */

            /* grid-area: 3/1/4/3; */
        }

        .box-e{
            background-color: #3498DB;
            grid-column: 1/3;
            grid-row:4/5; /* grid-row: 4; */

            /* grid-column: 1/ span 2; */
            /* grid-row: 4/ span 1; */

            /* grid-area: 4/1/5/3; */
        }

    </style>
</head>
<body>
	<div class="grid-container">
        <div class="box box-a">A</div>
        <div class="box box-b">B</div>
        <div class="box box-c">C</div>
        <div class="box box-d">D</div>
        <div class="box box-e">E</div>
    </div>
</body>
</html>
