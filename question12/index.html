<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 12</title>
    <style>

        *{
            box-sizing: border-box;
            margin:0;
            padding:0;
        }
        body{
            font-family:serif;
            min-height:100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box-model{
            width: 250px;
            padding:10px 20px 20px 20px;
            border-top: 4px solid #E74D3D;
            border-bottom: 4px solid #3498DC;
            display:flex;
            flex-direction: column;
            gap:10px;
        }

        .box-model h3{
            color:#2C3E51;
            font-size: 1.2rem;
        }

        .box-model p{
            font-size: 1rem;
        }

    </style>
</head>
<body>
    <div class="box-model">
        <h3>Card Design</h3>
        <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit.</p>
    </div>
</body>
</html>
