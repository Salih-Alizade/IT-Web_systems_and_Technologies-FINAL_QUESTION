<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 25</title>
    <style>

        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            font-family:serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .software-engineering{
            width: 620px;
            padding: 0 20px;
            border-left: 6px solid #DB153D;
        }

        .software-engineering h1{
            margin-bottom: 20px;

            font-style: italic;
            color: #8B0000;
        }

        .software-engineering p{
            margin-top: 10px;
            line-height: 1.5;
            font-size: 1rem;
        }

        .software-engineering p span{
            color: #8B0000;
            font-weight: bold;
            text-decoration: underline;
        }

    </style>
</head>
<body>
	<div class="software-engineering">
        <h1>Software Engineering</h1>
        <p>Software engineering combines <span>computer science</span> principles with practical development skills to create robust applications.</p>
        <p>Understanding <span>algorithms and data structures</span> is crucial for solving complex problems efficiently.</p>
    </div>
</body>
