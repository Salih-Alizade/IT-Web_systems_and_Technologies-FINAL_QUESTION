<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 6</title>
    <style>
        
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            font-family:serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .Registrationform{
            width: 300px;
            border: 3px solid orangered;
            padding: 25px 20px 25px 20px;
            display:flex;
            flex-direction: column;
        }

        .Registrationform h3{
            font-size: 1.2rem;
            color: orangered;
            margin-bottom: 25px;
        }

        .Registrationform form input{
            width: 100%;
            border: 1px solid orange;
            border-radius: 2.5px;
            margin-bottom: 15px;
            padding: 10px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .Registrationform form input:focus {
            border-color: black;
        }

        .Registrationform form button{
            width: fit-content;
            border:0px;
            border-radius: 2.5px;
            padding: 10px 20px 10px 20px;
            color:white;
            background-color: orangered;
            transition: background-color 0.2s ease;
        }

        .Registrationform form button:hover{
            background-color: orange;
            cursor:pointer;
        }

        /*.Registrationform form label{
            display:none;
        }*/

        .Registrationform form label{
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

    </style>
</head>
<body>
	<div class="Registrationform">
        <h3>Registration Form</h3>
        <form>
            <label for="User_name">Username</label>
            <input type="text" id="User_name" placeholder="Username">
            <label for="User_Age">Age</label>
            <input type="number" id="User_Age" placeholder="Age" min="0" max="100" required>
            <label for="User_Phone">Phone</label>
            <input type="tel" id="User_Phone" placeholder="Phone">
            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
