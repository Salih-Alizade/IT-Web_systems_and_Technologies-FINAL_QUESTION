<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 18</title>
    <style>

        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            font-family:serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contact-form{
            padding:20px;
            border: 3px solid #3E3E9D;
            
            width: 280px;
        }

        .contact-form form{
            display: flex;
            flex-direction: column;

        }

        .contact-form h3{
            text-align: center;
            color: #000080;
            margin-bottom: 10px;
        }
        
        .contact-form form label{
            margin-bottom: 3px;
            color: #000080;
            font-weight: bold;
        }

        .contact-form form input{
            width:100%;
            padding: 5px;
            margin-bottom: 15px;
            outline: none;
            border: 3px solid #000080;
        }

        .contact-form form input:focus{
            border: 3px solid green;
        }

        .contact-form form button{
            padding: 10px 40px;
            background-color: #000080;
            color: #fff;
            border: none;
            transition: background-color 0.2s ease;
        }

        .contact-form form button:hover{
            background-color: #3E3E9D;
            cursor: pointer;
        }

    </style>
</head>
<body>
	<div class="contact-form">
        <h3>Contact Form</h3>
        <form>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="user-name" placeholder="Enter your name" required>
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="user-email" placeholder="your@email.com" required>
            <label for="phone-number">Phone Number:</label>
            <input type="tel" id="phone-number" name="user-phone-number" placeholder="Phone number" required>
            <button type="submit">Send Message</button>
        </form>
    </div>
</body>
</html>
