<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2</title>
    <style>

        body{
            font-family:serif;
            margin: 0;
            padding: 0px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            width: 360px;
            border: 3px solid green;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            margin: 0;
            gap: 5px;
        }

        label{
            font-weight: bold;
        }

        input{
            margin-bottom: 15px;
            padding: 10px;
        }
        select{
            margin-bottom: 20px;
            padding: 10px;
        }

        button{
            padding: 10px 30px;
            border-radius: 8px;
            align-self: flex-start;
            background-color: darkgreen;
            color:white;
            cursor: pointer;
        }

    </style>
</head>

<body>
    
    <form class="container">
        <label for="user_name">Name:</label>
        <input type="text" id="user_name" name="Username" placeholder="Enter your name">

        <label for="user_email">Email:</label>
        <input type="email" id="user_email" name="Email" placeholder="Email address">

        <label for="city">City:</label>
        <select name="City" id="city">
            <option value="tr">Istanbul</option>

            <option value="usa" selected>New York</option>
            
            <option value="az">Baku</option>
        </select>
        
        <button type="submit">Submit</button>
    </form>

</body>

</html>
