<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 13</title>
    <style>

        *{
            box-sizing: border-box;
            margin:0;
            padding:0;
        }
        body{
            font-family:serif;
            min-height:100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .web-technologies{
            width: 590px;    
            padding:5px 0 5px 15px;
            border-left: 5px solid #E67F27;
            display:flex;
            flex-direction: column;
            gap:20px;
        }

        .web-technologies h1{
            color: #E67F27;
            font-size: 2rem;
            font-style: italic;
            color:#D15301
        }

        .web-technologies p{
            font-size: 1rem;    
        }

        .web-technologies span{
            color:#BF382A;
            text-decoration: underline;
            font-weight: 700;
            font-size: 1rem; 
        }
        
    </style>
</head>
<body>
	<div class="web-technologies">
        <h1>Web Technologies</h1>
        <p>Modern web technologies allow creating <span>dynamic</span> and interactive websites.</p>
        <p>HTML provides structure, CSS provides design, and JavaScript provides <span>functionality</span>.</p>
    </div>
</body>
</html>
